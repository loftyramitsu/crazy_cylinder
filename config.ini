; ============================================================
; Fichier de configuration de la simulation CFD 2D
; Format INI : clé = valeur  (commentaires avec ; ou #)
; ============================================================

[grille]

nx     = 64         ; nombre de cellules en x
ny     = 100         ; nombre de cellules en y
lx     = 2.0         ; longueur physique en x (m)
ly     = 3.5         ; longueur physique en y (m)

[fluide]
nu     = 5e-3        ; viscosité cinématique (m²/s)
rho    = 1.0         ; masse volumique (kg/m³)
U      = 5.0         ; vitesse d'entrée (m/s)
p0     = 0.0         ; pression initiale (Pa)

[cylindre]
cx     = 0.93         ; position x du centre (m)
cy     = 0.65         ; position y du centre (m)
radius = 0.1         ; rayon du cylindre (0 = pas de cylindre)

[simulation]
Tmax   = 40.0         ; temps physique final (s)
eps    = 1e-3        ; tolérance solveur pression
maxiter = 30         ; itérations max solveur pression


[export]
output_dir = ../../output	; dossier de sortie des CSV

[affichage]
champ  = vort		; ux | uy | p | u_norm | vort
